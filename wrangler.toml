name = "cc-x402-check"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = false

# Free demo limit: 5 checks per minute per IP.
[[ratelimits]]
name = "DEMO_LIMIT"
namespace_id = "4021"
  [ratelimits.simple]
  limit = 5
  period = 60
